[project]
name = "game-client"
version = "1.0.0"
description = "五子棋 AI 对弈学习 Windows 桌面应用（本地引擎 + LLM 解说）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Solariade" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pyinstaller>=6.6",
]

[project.urls]
Homepage = "https://github.com/Solariade/game-client"
Repository = "https://github.com/Solariade/game-client"
Issues = "https://github.com/Solariade/game-client/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*"]
