name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 禁止 uv 下载自带 Python：Windows runner 上官方 Python 的 Tcl/Tk 更完整
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    name: Lint, type check & test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --python "$env:pythonLocation\python.exe"
          uv run python -c "import sys; print('Python:', sys.executable)"

      - name: Probe Tk
        continue-on-error: true
        run: uv run python -c "import tkinter as tk; r = tk.Tk(); r.destroy(); print('Tk', tk.TkVersion, 'OK')"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Test
        run: uv run pytest
